<!doctype html>
<html lang="pl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, follow">
    <title>Nie znaleziono strony — NaSerwis.pl</title>
    <meta name="description" content="Podany adres nie istnieje. Wróć na stronę główną NaSerwis.pl lub skontaktuj się z serwisem IT.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
    <style>
        :root { color-scheme: light; --navy: #0a2540; --navy-light: #1a4d7a; --mint: #00d4aa; --text: #2d3748; }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; color: var(--text); font: 18px/1.6 "IBM Plex Sans", sans-serif; background: radial-gradient(circle at 75% 20%, rgba(0,212,170,.18), transparent 30%), linear-gradient(135deg, var(--navy), var(--navy-light)); }
        main { width: min(680px, 100%); padding: clamp(32px, 7vw, 64px); border-radius: 24px; background: rgba(255,255,255,.98); box-shadow: 0 24px 80px rgba(0,0,0,.3); }
        .logo { display: inline-block; margin-bottom: 36px; color: var(--navy); font: 800 27px/1 "Poppins", sans-serif; text-decoration: none; }
        .logo span, .code { color: #00a987; }
        .code { margin: 0 0 8px; font: 700 16px/1.2 "Poppins", sans-serif; letter-spacing: .12em; text-transform: uppercase; }
        h1 { margin: 0 0 16px; color: var(--navy); font: 800 clamp(34px, 7vw, 54px)/1.08 "Poppins", sans-serif; }
        p { margin: 0 0 28px; }
        .actions { display: flex; flex-wrap: wrap; gap: 12px; }
        .button { display: inline-flex; align-items: center; justify-content: center; min-height: 50px; padding: 12px 22px; border: 2px solid var(--navy); border-radius: 10px; color: var(--navy); font-weight: 600; text-decoration: none; }
        .button-primary { border-color: var(--mint); background: var(--mint); box-shadow: 0 8px 24px rgba(0,212,170,.28); }
        .button:focus-visible { outline: 3px solid #ffbf47; outline-offset: 3px; }
    </style>
</head>
<body>
    <main>
        <a class="logo" href="/" aria-label="NaSerwis.pl — strona główna">Na<span>Serwis</span></a>
        <p class="code">Błąd 404</p>
        <h1>Nie znaleźliśmy tej strony</h1>
        <p>Adres mógł się zmienić albo zawierać literówkę. Wróć na stronę główną lub zadzwoń — pomożemy także z problemem sieci, WiFi lub internetu.</p>
        <div class="actions">
            <a class="button button-primary" href="/">Wróć na stronę główną</a>
            <a class="button" href="tel:+48453327678">Zadzwoń: +48 453 327 678</a>
        </div>
    </main>
</body>
</html>
